<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اختبار إلكتروني</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        font-weight: 900;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      .hidden {
        display: none !important;
      }

      #login-container {
        max-width: 400px;
        margin: 100px auto;
        padding: 30px;
        background-color: #ffffff;
        border: 2px solid #007bff;
        border-radius: 15px;
        box-shadow: 0 5px 25px rgba(0, 123, 255, 0.2);
        text-align: center;
        transition: all 0.3s ease-in-out;
      }

      #login-container label {
        display: block;
        font-size: 18px;
        color: #333;
        margin-bottom: 8px;
        text-align: right;
      }

      #login-container input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
      }

      #login-container button {
        width: 100%;
        background-color: #007bff;
        color: white;
        padding: 12px 0;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      #login-container button:hover {
        background-color: #0056b3;
      }

      #result {
        margin-top: 20px;
        text-align: right;
      }

      #timer {
        font-size: 20px;
        color: red;
        font-weight: bold;
      }

      h2 {
        font-size: 22px;
        font-weight: 900;
        color: #000000;
      }

      label {
        font-size: 18px;
        font-weight: 900;
        color: #333333;
      }

      #next-button {
        position: absolute;
        left: 20px;
        bottom: 20px;
        padding: 10px 20px;
        font-weight: 900;
      }

      .correct-answer {
        color: green;
        font-weight: 900;
      }

      .wrong-answer {
        color: red;
        font-weight: 900;
      }

      ul {
        list-style-type: none;
        padding: 0;
      }

      ul li {
        margin-bottom: 15px;
        background-color: #f0f4f8;
        padding: 10px;
        border-radius: 6px;
        font-weight: 900;
        color: #000;
        font-size: 18px;
      }

      #result h2,
      #result h3,
      #result p {
        font-weight: 900;
        color: #000;
        font-size: 18px;
        text-align: right;
      }

      #retry-button {
        padding: 10px 20px;
        font-weight: bold;
        background-color: #007bff;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 20px;
      }

      label[lang="en"] {
        direction: ltr;
        text-align: left;
        display: block;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <h2>التدريب علي اختبارات الجهاز المركزى</h2>

    <div id="login-container">
      <label for="password">🔒 أدخل كلمة المرور:</label>
      <input id="password" type="password" placeholder="مثال: 12345678" />
      <label for="duration">⏳ حدد مدة الاختبار (بالدقائق):</label>
      <input id="duration" type="number" value="5" min="1" />
      <button onclick="checkPassword()">🚀 دخول</button>
    </div>

    <div class="hidden" id="quiz">
      <div id="timer">5:00</div>
      <div id="question-info">السؤال 1 من 20</div>
      <form id="quizForm">
        <div id="question-container"></div>
        <button id="next-button" onclick="nextQuestion(event)" type="button">
          التالي
        </button>
      </form>
    </div>

    <div class="hidden" id="result"></div>

    <script>
      const questions = [
        {
          question: "My parents want me to ……… my studies.",
          options: ["Avoid", "Neglect", "Prioritize", "Ignore"],
          answer: "Prioritize",
          explanation:
            "ترجمة السؤال: والداي يريدان مني أن أعطي الأولوية لدراستي. الإجابة: Prioritize (أعطي الأولوية)",
        },
        {
          question: "What is the opposite of black?",
          options: ["White", "Blue", "Red", "Green"],
          answer: "White",
          explanation:
            "ترجمة السؤال: ما عكس اللون الأسود؟ الإجابة: White (أبيض)",
        },
        {
          question: "I want to take a holiday to ……… with my family.",
          options: ["Relax", "Work", "Study", "Fix"],
          answer: "Relax",
          explanation:
            "ترجمة السؤال: أريد أن آخذ إجازة لكي أسترخي مع عائلتي. الإجابة: Relax (أسترخي)",
        },
        {
          question: "Where do we go to read books?",
          options: ["Hospital", "Bakery", "Library", "Bank"],
          answer: "Library",
          explanation:
            "ترجمة السؤال: إلى أين نذهب لقراءة الكتب؟ الإجابة: Library (المكتبة)",
        },
        {
          question: "The chef ……… delicious desserts for them.",
          options: ["fixes", "cooks", "plays", "writes"],
          answer: "cooks",
          explanation:
            "ترجمة السؤال: الطاهي ……… حلويات لذيذة لهم. الإجابة: cooks (يطبخ)",
        },
        {
          question:
            'What is the past simple form (second form) of the verb "sleep"?',
          options: ["sleeped", "slept", "sleeping", "sleeps"],
          answer: "slept",
          explanation:
            "ترجمة السؤال: ما صيغة الماضي البسيط، التصريف الثاني، للفعل sleep؟ الإجابة: slept (نام)",
        },
        {
          question: "Choose the correct future tense form.",
          options: ["will have", "had", "has", "having"],
          answer: "will have",
          explanation:
            "ترجمة السؤال: اختر صيغة المستقبل الصحيحة. الإجابة: will have (سوف يكون لديه)",
        },
        {
          question:
            'What is the past participle (third form) of the verb "win"?',
          options: ["winer", "winning", "won"],
          answer: "won",
          explanation:
            "ترجمة السؤال: ما التصريف الثالث للفعل win؟ الإجابة: won (فاز)",
        },
        {
          question: "I ……… a headache every day.",
          options: ["has", "have", "am having", "had"],
          answer: "have",
          explanation:
            "ترجمة السؤال: أعاني من صداع كل يوم. الإجابة: have (لدي)",
        },
        {
          question:
            "Which fruit has a hard outer shell and is juicy on the inside?",
          options: ["Apple", "Banana", "Watermelon", "Strawberry"],
          answer: "Watermelon",
          explanation:
            "ترجمة السؤال: أي فاكهة لها قشرة خارجية صلبة وتكون غنية بالعصير من الداخل؟ الإجابة: Watermelon (البطيخ)",
        },
        {
          question: "Which bird can imitate human speech?",
          options: ["Eagle", "Owl", "Duck", "Parrot"],
          answer: "Parrot",
          explanation:
            "ترجمة السؤال: أي طائر يستطيع تقليد كلام الإنسان؟ الإجابة: Parrot (الببغاء)",
        },
        {
          question:
            "Which of the following colors is created by mixing yellow and brown?",
          options: ["Blue", "Red", "Ochre", "Green"],
          answer: "Ochre",
          explanation:
            "ترجمة السؤال: أي من الألوان التالية ينتج عن خلط الأصفر والبني؟ الإجابة: Ochre (الأصفر المغرة)",
        },
        {
          question: 'What part of speech is the word "eat"?',
          options: ["Noun", "Verb", "Adjective", "Adverb"],
          answer: "Verb",
          explanation:
            "ترجمة السؤال: ما نوع الكلمة eat من حيث أقسام الكلام؟ الإجابة: Verb (فعل)",
        },
        {
          question:
            "Which hard, black substance found underground is used as fuel?",
          options: ["Apple", "Book", "Coal", "Wheel"],
          answer: "Coal",
          explanation:
            "ترجمة السؤال: ما المادة السوداء الصلبة الموجودة تحت الأرض والتي تستخدم كوقود؟ الإجابة: Coal (الفحم)",
        },
        {
          question: "What is the plural form of 'ox'?",
          options: ["oxs", "oxen", "oxes", "oxies"],
          answer: "oxen",
          explanation: "جمع كلمة ox التي تعني ثور هو oxen التي تعني ثيران.",
        },
        {
          question:
            "A piece of clothing worn on the top part of the body, usually fastened with buttons down the front is a:",
          options: ["Shirt", "Dress", "Trousers", "Skirt"],
          answer: "Shirt",
          explanation:
            "Shirt تعني قميص، وهو قطعة ملابس تُرتدى في الجزء العلوي من الجسم وعادةً تُغلق بأزرار من الأمام.",
        },
      ];
      let currentQuestion = 0;
      let score = 0;
      let timer;
      let timeLeft;
      let userAnswers = [];

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }

      function shuffleQuestions() {
        shuffle(questions);
        questions.forEach((q) => shuffle(q.options));
      }

      function checkPassword() {
        const passwordInput = document.getElementById("password").value;
        const durationInput =
          parseInt(document.getElementById("duration").value) || 10;
        timeLeft = durationInput * 60;

        if (passwordInput === "13") {
          shuffleQuestions();
          document.getElementById("login-container").classList.add("hidden");
          document.getElementById("quiz").classList.remove("hidden");
          document.getElementById("result").classList.add("hidden");
          currentQuestion = 0;
          score = 0;
          userAnswers = [];
          loadQuestion();
          startTimer();
        } else {
          alert("🚫 المحاولة غير صحيحة! تأكد من كتابة كلمة السر بشكل دقيق.");
        }
      }

      function loadQuestion() {
        const questionContainer = document.getElementById("question-container");
        questionContainer.innerHTML = `
    <h2 lang="en" dir="ltr">${questions[currentQuestion].question}</h2>
    ${questions[currentQuestion].options
      .map(
        (option) => `
      <label lang="en" dir="ltr">
        <input type="radio" name="option" value="${option}" />
        ${option}
      </label><br>
    `,
      )
      .join("")}
  `;
        document.getElementById("question-info").textContent = `السؤال ${
          currentQuestion + 1
        } من ${questions.length}`;
      }

      function nextQuestion(event) {
        event.preventDefault();
        const selected = document.querySelector('input[name="option"]:checked');
        if (!selected) return alert("اختر إجابة.");
        userAnswers[currentQuestion] = selected.value;
        if (selected.value === questions[currentQuestion].answer) score++;
        currentQuestion++;
        if (currentQuestion < questions.length) {
          loadQuestion();
        } else {
          clearInterval(timer);
          showResults();
        }
      }

      function showResults(timeUp = false) {
        document.getElementById("quiz").classList.add("hidden");
        const resultDiv = document.getElementById("result");
        resultDiv.classList.remove("hidden");

        const percent = ((score / questions.length) * 100).toFixed(1);

        let feedback = "";
        if (percent == 100) {
          feedback = "أنت بطل! برافو عليك 👏";
        } else if (percent >= 80) {
          feedback = "ممتاز! واضح إنك مذاكر كويس 💪";
        } else if (percent >= 60) {
          feedback = "كويس، بس محتاج تراجع شوية 🙂";
        } else if (percent >= 40) {
          feedback = "راجع الدروس تاني وحاول تركز أكتر 📚";
        } else {
          feedback = "ابدأ من الأول وراجع كويس، شد حيلك! 💡";
        }

        let warningMsg = "";
        if (timeUp && currentQuestion < questions.length) {
          warningMsg = `
        <p style="color: red;">⏰ انتهى الوقت قبل إكمال جميع الأسئلة.</p>
        <p>في المرة الجاية حاول تحل الأسئلة بشكل أسرع علشان تلحق تكمل 💡</p>
      `;
        }

        let review = "<h3>مراجعة الإجابات:</h3><ul>";
        questions.forEach((q, i) => {
          const ua = userAnswers[i] || "لم يُجب";
          const correct = q.answer;
          const isCorrect = ua === correct;
          review += `
        <li>
          <strong>السؤال ${i + 1}:</strong> ${q.question}<br>
          إجابتك: <span class="${
            isCorrect ? "correct-answer" : "wrong-answer"
          }">${ua}</span><br>
          الإجابة الصحيحة: <span class="correct-answer">${correct}</span><br>
          <strong>التفسير:</strong> ${q.explanation || "لا يوجد تفسير."}
        </li>
      `;
        });
        review += "</ul>";

        resultDiv.innerHTML = `
      ${warningMsg}
      <h2>نتيجة الاختبار</h2>
      <p>${score} من ${questions.length} | النسبة: ${percent}%</p>
      <p>${feedback}</p>
      ${review}
      <button id="retry-button" onclick="location.reload()">إعادة المحاولة</button>
    `;
      }

      function startTimer() {
        timer = setInterval(() => {
          timeLeft--;
          const minutes = Math.floor(timeLeft / 60);
          const seconds = timeLeft % 60;
          document.getElementById("timer").textContent = `${minutes}:${
            seconds < 10 ? "0" : ""
          }${seconds}`;
          if (timeLeft <= 0) {
            clearInterval(timer);
            alert("انتهى الوقت!");
            showResults(true);
          }
        }, 1000);
      }

      document
        .getElementById("quizForm")
        .addEventListener("keypress", function (event) {
          if (event.key === "Enter") {
            event.preventDefault();
            nextQuestion(event);
          }
        });
    </script>
  </body>
</html>
